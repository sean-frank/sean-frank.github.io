title: Sean Frank
# Drop the GitHub Pages default Primer theme. Layouts in this repo are the site.
theme: null
author: Sean Frank
description: "Sean Frank is a security engineer focused on cloud incident response, threat investigation, and detection."
url: "https://seanpfrank.com"
baseurl: ""
lang: en

email: sean@seanpfrank.com
github_username: sean-frank
linkedin_username: seanfrank-

social:
  links:
    - https://github.com/sean-frank
    - https://www.linkedin.com/in/seanfrank-

markdown: kramdown
permalink: pretty

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang: plaintext
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

titles_from_headings:
  enabled: true
  strip_title: false
  collections: true

defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/og-image.png
        width: 1200
        height: 630
        alt: "Sean Frank, security engineer focused on cloud incident response, threat investigation, and detection"
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      syntax: true
      author: Sean Frank

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - .jekyll-metadata
  - .bundle/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
