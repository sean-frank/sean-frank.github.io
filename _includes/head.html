<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
<title>{%- if page.title and page.title != site.title -%}{{ page.title | escape }} | {% endif -%}{{ site.title | escape }}</title>
{% seo title=false %}
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="icon" href="{{ '/assets/favicon-32.png' | relative_url }}" type="image/png" sizes="32x32">
<link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}" sizes="any">
<link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
<link rel="preload" href="{{ '/assets/fonts/inter-600.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin fetchpriority="high">
<link rel="preload" href="{{ '/assets/fonts/inter-400.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
{%- if page.url == "/" -%}
<link rel="preload" href="{{ '/assets/fonts/jetbrains-mono-eyebrow.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
{%- endif -%}
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
{%- if page.syntax -%}
<link rel="stylesheet" href="{{ '/assets/css/syntax.css' | relative_url }}">
{%- endif -%}
{% feed_meta %}
